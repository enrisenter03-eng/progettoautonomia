{% extends 'base.html' %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 70vh;">
    <div style="background: #fdfdfd; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border: 1px solid #eee;">
        <h2 style="color: #2c3e50; margin-bottom: 30px;">Accesso Biblioteca MUSE</h2>
        <form method="POST">
            <div style="text-align: left; margin-bottom: 20px;">
                <label>Username</label>
                <input type="text" name="username" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="text-align: left; margin-bottom: 30px;">
                <label>Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>
            <button type="submit" class="btn btn-blue" style="width: 100%; padding: 14px; font-size: 1rem;">Entra nel Sistema</button>
        </form>
    </div>
</div>
{% endblock %}
