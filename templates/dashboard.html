{% extends 'base.html' %}
{% block content %}
<h1>Benvenuto, {{ session.user }}</h1>
<p>Ruolo attuale: <span class="badge badge-green">{{ session.ruolo }}</span></p>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px;">
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-top: 4px solid var(--accent); text-align: center;">
        <h2 style="margin:0;">{{ stats.totali }}</h2>
        <p style="color: #666;">Materiali Totali</p>
    </div>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-top: 4px solid var(--danger); text-align: center;">
        <h2 style="margin:0;">{{ stats.prestiti }}</h2>
        <p style="color: #666;">Prestiti Attivi</p>
    </div>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border-top: 4px solid var(--success); text-align: center;">
        <h2 style="margin:0;">{{ stats.utenti }}</h2>
        <p style="color: #666;">Utenti Registrati</p>
    </div>
</div>
{% endblock %}
